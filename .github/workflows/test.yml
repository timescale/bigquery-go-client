name: Test

on:
  push:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # still allow manual triggering

permissions:
  contents: read

jobs:
  go-versions:
    name: Go Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go Versions
        uses: arnested/go-version-action@cc3eac5ef2e6c3e780f3ecc2be9ef9cea799ef9f # v2.1.8
        id: versions

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: go-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.go-versions.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          check-latest: true

      - name: Mod
        run: go mod tidy --diff

      - name: Format
        run: go tool gofumpt -d . || { echo "::error::files have not been formatted with gofumpt; run 'go tool gofumpt -l -w .' and commit the result"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Fix
        run: go fix -diff ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Govulncheck
        run: go tool govulncheck ./...

      - name: Test
        # Under -coverpkg, the percentages go test prints are of the whole
        # module, not the package. Writing covdata lets the Coverage step
        # report real per-package figures.
        run: mkdir -p covdata && go test -race -cover -coverpkg=./... ./... -args -test.gocoverdir="$PWD/covdata"

      - name: Coverage
        run: go tool covdata percent -i=covdata

      - name: Generate Coverage Report
        run: |
          go tool covdata textfmt -i=covdata -o=coverage.out
          go tool cover -html=coverage.out -o=coverage.html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.version }}.html
          path: coverage.html
